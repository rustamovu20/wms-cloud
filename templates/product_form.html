{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'New' }} Product{% endblock %}
{% block crumb %}{{ 'Edit Product' if product else 'New Product' }}{% endblock %}
{% block content %}
<div class="panel">
  <form method="post" class="form-grid">
    <div class="field">
      <label>SKU</label>
      <input name="sku" value="{{ product.sku if product else '' }}" required>
    </div>
    <div class="field">
      <label>Product name</label>
      <input name="name" value="{{ product.name if product else '' }}" required>
    </div>
    <div class="field">
      <label>Category</label>
      <input name="category" value="{{ product.category if product else '' }}">
    </div>
    <div class="field">
      <label>Size</label>
      <input name="size" value="{{ product.size if product else '' }}">
    </div>
    <div class="field">
      <label>Colour</label>
      <input name="color" value="{{ product.color if product else '' }}">
    </div>
    <div class="field">
      <label>Quantity</label>
      <input name="quantity" type="number" value="{{ product.quantity if product else 0 }}">
    </div>
    <div class="field">
      <label>Reorder level</label>
      <input name="reorder_level" type="number" value="{{ product.reorder_level if product else 10 }}">
    </div>
    <div class="field">
      <label>Wholesale price ($)</label>
      <input name="price" type="number" step="0.01" value="{{ product.price if product else 0 }}">
    </div>
    <div class="field full actions">
      <button class="btn" type="submit">{{ 'Save changes' if product else 'Create product' }}</button>
      <a class="btn ghost" href="{{ url_for('products') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
