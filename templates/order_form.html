{% extends "base.html" %}
{% block title %}New Order{% endblock %}
{% block crumb %}New Sales Order{% endblock %}
{% block content %}
<div class="panel">
  <form method="post" class="form-grid">
    <div class="field">
      <label>Reference <span class="muted">(leave blank to auto-generate)</span></label>
      <input name="reference" placeholder="SO-1005">
    </div>
    <div class="field">
      <label>Customer</label>
      <select name="customer_id" required>
        <option value="">— Select customer —</option>
        {% for c in customers %}
        <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Product (SKU)</label>
      <select name="sku" required>
        {% for s in skus %}
        <option value="{{ s.sku }}">{{ s.sku }} — {{ s.name }} ({{ s.quantity }} in stock)</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Quantity</label>
      <input name="qty" type="number" min="1" value="1" required>
    </div>
    <div class="field">
      <label>Status</label>
      <select name="status">
        {% for s in statuses %}{% if s != 'Cancelled' %}<option>{{ s }}</option>{% endif %}{% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Notes</label>
      <input name="notes" placeholder="Optional order notes">
    </div>
    <div class="field full actions">
      <button class="btn" type="submit">Create order</button>
      <a class="btn ghost" href="{{ url_for('orders') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
