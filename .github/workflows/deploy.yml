name: Deploy NimbusWMS

# CI/CD pipeline for D.P8.
# Flow: push to main -> build/test -> SSH to EC2 -> pull + restart service.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke test (app imports + DB init + health route)
        run: |
          python -c "import app; app.init_db(); c=app.app.test_client(); r=c.get('/health'); assert r.status_code==200, r.status_code; print('health OK', r.json)"

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}          # ALB or instance public DNS/IP
          username: ${{ secrets.EC2_USER }}      # e.g. ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}        # private key (repo secret)
          script: |
            cd /opt/wms
            sudo git pull origin main
            sudo /opt/wms/.venv/bin/pip install -r requirements.txt
            sudo systemctl restart wms
            echo "Deployed commit $(git rev-parse --short HEAD) to $(hostname)"
