name: Deploy NimbusWMS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke test (app imports + DB init + health route)
        run: |
          python -c "import app; app.init_db(); c=app.app.test_client(); r=c.get('/health'); assert r.status_code==200, r.status_code; print('health OK', r.json)"

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo git config --global --add safe.directory /opt/wms
            cd /opt/wms
            sudo git pull origin master
            sudo /opt/wms/.venv/bin/pip install -r requirements.txt
            sudo systemctl restart wms
            echo "Deployed commit $(sudo git rev-parse --short HEAD) to $(hostname)"
